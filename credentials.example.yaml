# Device credential store — EXAMPLE
#
#   cp credentials.example.yaml credentials.yaml
#   chmod 600 credentials.yaml
#
# The real file must be mode 0600. NAS refuses to start in staging/production if
# it is readable by group or other.
#
# Switch credentials are deliberately kept OUT of the database. The `switches`
# table stores only `credential_ref` — a name that points at an entry here — so a
# database dump grants no access to any network device.
#
# Register a switch against an entry with:
#   nas switch add --name adc-core-sw1 --hostname 10.20.0.11 \
#                  --vendor juniper --credential-ref juniper-core
#
# Verify every reference resolves (prints names only, never secrets):
#   nas credentials check
#
# Grant NAS a READ-ONLY account on each switch. Phase 1 only reads device state;
# nothing in this service modifies switch configuration. Least privilege here
# limits the blast radius if the host is ever compromised.

credentials:
  # Password authentication
  juniper-core:
    username: nas-readonly
    auth_method: password
    password: change-me

  # SSH key authentication — preferred. The key file itself must also be 0600.
  juniper-edge:
    username: nas-readonly
    auth_method: ssh_key
    private_key_path: /etc/nas/keys/id_ed25519
    # Omit if the key has no passphrase.
    private_key_passphrase: change-me

  # Backs the mock driver used for local development and CI, where no real
  # switch is reachable. The values are never used to connect to anything.
  mock-local:
    username: mock
    auth_method: password
    password: mock
