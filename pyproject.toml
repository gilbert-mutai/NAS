[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nas"
version = "0.1.0"
description = "Network Automation Service — VLAN discovery and network automation backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2.0",
    "structlog>=24.4,<26.0",
    "PyYAML>=6.0,<7.0",
    "typer>=0.15,<1.0",
    "defusedxml>=0.7,<1.0",
    "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
# Only the Juniper driver needs PyEZ. The core, the reconciliation engine and the
# whole test suite run without it.
juniper = [
    "junos-eznc>=2.7,<3.0",
]
dev = [
    # pytest >= 9.0.3: earlier lines carry PYSEC-2026-1845. pytest-asyncio >= 1.4
    # is the first release that supports pytest 9.
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.4,<2.0",
    "pytest-cov>=7.0,<8.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "types-PyYAML>=6.0,<7.0",
    "types-defusedxml>=0.7,<1.0",
    "pip-audit>=2.7,<3.0",
]

[project.scripts]
nas = "nas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nas"]

# ── Linting & formatting ──────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # flake8-bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ASYNC",     # async correctness
    "S",         # bandit security
    "RUF",
]
ignore = [
    "S101",  # assert — used intentionally in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hardcoded test credentials are fine

# ── Type checking ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["nas"]

[[tool.mypy.overrides]]
module = ["nas.db.migrations.*"]
ignore_errors = true

# Third-party packages that ship no type information. PyEZ and lxml are only
# imported by the Juniper driver (an optional extra); APScheduler has no
# py.typed marker. Their call sites are narrowly contained and covered by tests.
[[tool.mypy.overrides]]
module = [
    "jnpr.*",
    "lxml.*",
    "apscheduler.*",
]
ignore_missing_imports = true

# ── Tests ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL database (set NAS_TEST_DATABASE_URL)",
]

[tool.coverage.run]
source = ["src/nas"]
branch = true
