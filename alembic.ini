[alembic]
script_location = src/nas/db/migrations
prepend_sys_path = src
path_separator = os
timezone = UTC

# The database URL is intentionally NOT set here. It is read from NAS_DATABASE_URL
# via nas.core.config inside env.py, so there is exactly one source of truth and
# no credential ever lands in a committed file.

[post_write_hooks]
# "exec" rather than "console_scripts": ruff ships as a compiled binary and
# registers no console_scripts entry point, so entrypoint lookup fails.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
